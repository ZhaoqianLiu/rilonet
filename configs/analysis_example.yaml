project_root: ..

compute:
  workers: 1
  blas_threads: 1
  tasks_per_worker: 4
  start_method: spawn

paths:
  metadata: data/metadata.tsv
  output_dir: analysis

metadata:
  sep: "\t"
  columns:
    sample_id: sample_id
    participant_id: participant_id
    omic: omic
    group: group
    collection_date: collection_date
    study_time: study_week
    canonical_biosample_id: biosample_id
  omic_mapping:
    MG: MG
    MT: MT
    MB: MB
  group_levels: [reference, condition]
  reference_group: reference
  group_mapping: {}
  study_time_unit_days: 7
  allow_canonical_fallback: false
  canonical_id_replacements: []

omics:
  MG:
    path: data/MG.tsv
    orientation: profiles_by_features
    sep: "\t"
    preprocessing:
      mode: raw
      prevalence: 0.10
      transform: clr
      iqr_bottom_percentile: 0.10
  MT:
    path: data/MT.tsv
    orientation: profiles_by_features
    sep: "\t"
    preprocessing:
      mode: raw
      prevalence: 0.10
      transform: clr
      iqr_bottom_percentile: 0.10
  MB:
    path: data/MB.tsv
    orientation: profiles_by_features
    sep: "\t"
    preprocessing:
      mode: raw
      prevalence: 0.05
      transform: pqn_log2
      iqr_bottom_percentile: 0.10

covariates:
  categorical: [site, sex, exposure]
  numeric: [age]
  static: [site, sex, age]

residualization:
  include_group_main_effect: true
  time_spline_df: 3
  min_observations: 20
  min_subjects: 8
  reml: true
  max_iterations: 200
  optimizers: [lbfgs, powell, cg]

matching:
  near_tolerance_days: 14
  lag_windows:
    - name: lag_4_8w
      min_days: 28
      max_days: 56
      target_days: 42
  baseline_lookback_days: 28

screening:
  min_pairs: 30
  min_subjects: 10
  min_abs_correlation: 0.15
  top_k_per_feature: 15
  max_edges_per_block: 5000
  baseline_mode: none

modeling:
  min_pairs: 30
  min_subjects: 10
  min_subjects_per_group: 5
  near_fit_both_orientations: true
  baseline_mode: none
  multiple_testing_scope: global
  max_iterations: 200
  optimizers: [lbfgs, powell, cg]

validation:
  q_threshold: 0.05
  max_edges: 100
  bootstrap_replicates: 500
  permutation_replicates: 1000
  permutation_strata: [site]
  seed: 20260715
