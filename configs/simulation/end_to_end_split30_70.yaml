# End-to-end simulation with a 30%/70% sample split.
# Thirty percent of participants are used for candidate screening and the
# remaining seventy percent for inference.

seed: 20262017
output_dir: ../../results/simulations/end_to_end_split30_70

end_to_end:
  enabled: true
  replicates: 200
  n_subjects: 240
  visits: 18
  condition_fraction: 0.50
  dimensions:
    MG: 12
    MT: 12
    MB: 12
  truth_modes:
    - "null"
    - differential
  inference_strategies:
    - sample_split
  screening_fraction: 0.30
  screening_threshold: 0.10
  max_candidates_per_block: 5
  q_threshold: 0.05
  multiple_testing_scope: global
  baseline_mode: adjust
  near_association_method: max_p
  retain_replicates: false
