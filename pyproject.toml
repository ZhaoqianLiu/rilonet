[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rilonet"
version = "0.1.0"
description = "Differential cross-omics networks for longitudinal MG, MT, and MB data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "patsy>=0.5.6",
  "pyarrow>=15",
  "PyYAML>=6",
  "scipy>=1.13,<2",
  "statsmodels>=0.14,<1",
  "threadpoolctl>=3.5,<4",
]

[project.optional-dependencies]
interpretation = [
  "igraph>=0.11,<1",
  "leidenalg>=0.10,<1",
]
dev = [
  "pytest>=8,<9",
]

[project.scripts]
rilonet = "rilonet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
